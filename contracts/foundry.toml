[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

[rpc_endpoints]
rh_testnet = "${RH_TESTNET_RPC}"
rh_mainnet = "${RH_MAINNET_RPC}"

[etherscan]
rh_testnet = { key = "blockscout", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630 }
